<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Room</title>
    <link rel="stylesheet" href="/static/Add_Room.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <div class="wrapper">
        <div class="form-box login">
            <h2>Add Room</h2>
            <form action="/add_room" method="post" enctype="multipart/form-data">
                <div class="input-box">
                    <input id="room_no" name="room_no" type="number" required>
                    <label>Room No</label>
                    <i class='bx bxs-building'></i>
                </div>
                <div class="input-box">
                    <input id="block_no" name="block_no" type="number" required>
                    <label>Block Number</label>
                    <i class='bx bx-buildings'></i>
                </div>
                <div class="input-box">
                    <input id="lat" name="lat" type="number" step="any" required>
                    <label>Room's Latitude</label>
                    <i class='bx bxs-location-plus'></i>
                </div>
                <div class="input-box">
                    <input id="long" name="long" type="number" step="any" required>
                    <label>Room's Longitude</label>
                    <i class='bx bxs-location-plus'></i>
                </div>
                <button type="submit" class="btn">Add</button>
            </form>
        </div>
        
        <div class="info-text login">
            <div id="map"></div> 
            <div class="button-container">
                <button type="button" class="btn" onclick="getLocation()">Fetch Current Location</button>
            </div>
        </div>
    </div>

    <script>
        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(showPosition, showError);
            } else {
                document.getElementById('map').innerHTML = "Geolocation is not supported by this browser.";
            }
        }

        function showPosition(position) {
            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;
            document.getElementById('lat').value = latitude;
            document.getElementById('long').value = longitude;
            const mapFrame = document.createElement('iframe');
            mapFrame.width = '100%';
            mapFrame.height = '300px';
            mapFrame.src = `https://maps.google.com/maps?q=${latitude},${longitude}&z=15&output=embed`;
            document.getElementById('map').innerHTML = '';
            document.getElementById('map').appendChild(mapFrame);
        }

        function showError(error) {
            console.log(error);
            switch (error.code) {
                case error.PERMISSION_DENIED:
                    document.getElementById('map').innerHTML = "User denied the request for Geolocation.";
                    break;
                case error.POSITION_UNAVAILABLE:
                    document.getElementById('map').innerHTML = "Location information is unavailable.";
                    break;
                case error.TIMEOUT:
                    document.getElementById('map').innerHTML = "The request to get user location timed out.";
                    break;
                case error.UNKNOWN_ERROR:
                    document.getElementById('map').innerHTML = "An unknown error occurred.";
                    break;
            }
}

    </script>
</body>
</html>
